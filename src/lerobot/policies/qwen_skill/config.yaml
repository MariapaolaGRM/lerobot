dataset:
  root: /home/mariapaolagerminario/datasets/behavior1k_training
  repo_id: behavior-1k/2025-challenge-demos

policy:
  # Qwen non ha type/pretrained_path come pi0 — il modello si scarica
  # automaticamente da HuggingFace dentro QwenSkillClassifier.load()
  model_name: Qwen/Qwen3-VL-8B-Instruct   # oppure Qwen/Qwen2.5-VL-7B-Instruct
  device: cuda
  num_skill_classes: 8                     # uguale a pi0
  image_keys:
    - observation.images.rgb.head
    - observation.images.rgb.left_wrist
    - observation.images.rgb.right_wrist
  task_key: task
  classifier_hidden_1: 1024
  classifier_hidden_2: 512

wandb:
  enable: true
  project: qwen-skill-classifier
  job_name: qwen-skill-classifier-test

save_checkpoint: true
output_dir: outputs/qwen_skill_classifier_test

# Questi rimangono identici a pi0
batch_size: 4          # abbassa da 16: Qwen3-VL-8B è molto più grande di pi0
steps: 50000
log_freq: 100
save_freq: 25000
eval_freq: 1000
seed: 42
resume: false

mode: train_val_test
eval_num_batches: 500
test_num_batches: 5000
inference_episodes: [1]

optimizer:
  lr: 2.5e-5
  weight_decay: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip_norm: 10.0