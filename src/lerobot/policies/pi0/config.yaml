dataset:
  root: /home/mariapaolagerminario/datasets/behavior1k_training
  repo_id: behavior-1k/2025-challenge-demos

policy:
  type: pi0
  pretrained_path: lerobot/pi0_base
  device: cuda
  # optimizer_lr: 2.5e-5
  # type: adamw
  # push_to_hub: False
  freeze_vision_encoder: True
  train_expert_only: True
  classifier_mode: True
  num_subskill_classes: 8
  n_action_steps: 30
  gradient_checkpointing: True
  
wandb:
  enable: true
  project: pi0-skill-classifier

save_checkpoint: true
output_dir: outputs/skill_classifier_test
batch_size: 16
steps: 50000
log_freq: 100
save_freq: 25000
eval_freq: 1000 # ogni quanto fare valutazione periodica
seed: 42
resume: false # riaddestra sempre dallo step 0 (perde pesi giá appresi)

# num_workers: 4

