dataset:
  root: /home/mariapaolagerminario/dataset/behavior1k_training
  repo_id: behavior-1k/2025-challenge-demos

policy:
  type: pi0
  pretrained_path: lerobot/pi0_base
  device: cuda
  # optimizer_lr: 2.5e-5
  # type: adamw
  # push_to_hub: False
  freeze_vision_encoder: True
  train_expert_only: True
  classifier_mode: True
  num_subskill_classes: 8
  n_action_steps: 30
  gradient_checkpointing: True
  
wandb:
  enable: true
  project: pi0-skill-classifier
save_checkpoint: true
output_dir: outputs/skill_classifier_test_1
batch_size: 4
steps: 500
log_freq: 20
save_freq: 500
#eval_freq: 500 # ogni quanto fare valutazione periodica
seed: 42
resume: false

# num_workers: 4

